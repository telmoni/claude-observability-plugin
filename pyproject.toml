[project]
name = "claude-observability-plugin"
version = "0.1.0"
description = "Telmoni's Claude Code plugin: each turn recorded as a run, metadata only."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.14,<1",
  "telmoni>=0.2,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hooks"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
